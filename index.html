<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ByteForge</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── EFEITO DE FOGO AMBIENTE ── -->
<div class="fire-glow"></div>
<div class="fire-particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<div id="app">

    <!-- ══════════════════════════════════════
         HEADER — mascote ByteForge + info
         ══════════════════════════════════════ -->
    <div id="header">

        <!--
            MASCOTE: ByteForge
        -->
        <div id="mascote-wrap" title="Clique em mim!">
        <!--
            MASCOTE: ByteForge — ferreiro de capacete viking que forja código
            viewBox: 0 0 120 116 (mesmo desenho do GIF da apresentação)
        -->
        <svg id="byteforge" viewBox="0 0 120 116" width="120" height="116" xmlns="http://www.w3.org/2000/svg" aria-label="ByteForge mascote forjador">

            <!-- ── BRILHO DA FORJA embaixo ── -->
            <ellipse class="bot-fire-shadow" cx="50" cy="107" rx="30" ry="4" fill="rgba(255,100,0,.28)"/>

            <!-- ── PEDESTAL + BASE ── -->
            <polygon points="34,89 68,89 65,108 37,108" fill="#1a1b1f" stroke="#6b5530" stroke-width="1.5"/>
            <rect x="22" y="95.5" width="57" height="7" rx="3.5" fill="#141518"/>

            <!-- ── CORPO (ombros com contorno de brasa) ── -->
            <path d="M 19 77 Q 48 68 77 73 L 74 88 L 24 88 Z" fill="#3a2e22" stroke="#ff8c42" stroke-width="1.6" stroke-linejoin="round"/>

            <!-- ── CABEÇA ── -->
            <rect x="21" y="28" width="58" height="40" rx="18" fill="#22262d" stroke="#14161a" stroke-width="1.5"/>
            <!-- viseira -->
            <rect x="25" y="33" width="50" height="31" rx="14" fill="#0f1115"/>
            <!-- sombra do capacete na viseira -->
            <rect x="25" y="33" width="50" height="7" rx="6" fill="rgba(140,104,50,.3)"/>
            <!-- viseira avermelhada quando está bravo -->
            <rect class="anger-tint" x="25" y="33" width="50" height="31" rx="14" fill="#ff2a00"/>

            <!-- ── CAPACETE VIKING ── -->
            <path d="M 28 24 Q 13 22 12 6 Q 19 15 31 16 Z" fill="#d4c9b8" stroke="#7a7063" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M 72 24 Q 87 22 88 6 Q 81 15 69 16 Z" fill="#d4c9b8" stroke="#7a7063" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M 23 27 C 23 8 77 8 77 27 Z" fill="#464b54" stroke="#1d2126" stroke-width="1.5"/>
            <rect x="19" y="24" width="62" height="8.5" rx="4.2" fill="#8c6832" stroke="#4a3517" stroke-width="1.5"/>
            <circle cx="28.5" cy="28.2" r="1.4" fill="#e0c294"/>
            <circle cx="50" cy="28.2" r="1.4" fill="#e0c294"/>
            <circle cx="71.5" cy="28.2" r="1.4" fill="#e0c294"/>

            <!-- ── OLHOS (pupilas seguem o mouse) ── -->
            <g class="eye">
                <ellipse cx="38" cy="47" rx="10.5" ry="8.8" fill="#ffca7a" stroke="#b5651d" stroke-width="2.2"/>
                <g id="eye-pupil-left">
                    <circle cx="38" cy="47" r="4.6" fill="#3a1f04"/>
                    <circle cx="40" cy="45" r="1.6" fill="#ffffff"/>
                </g>
            </g>
            <g class="eye delay">
                <ellipse cx="62" cy="47" rx="10.5" ry="8.8" fill="#ffca7a" stroke="#b5651d" stroke-width="2.2"/>
                <g id="eye-pupil-right">
                    <circle cx="62" cy="47" r="4.6" fill="#3a1f04"/>
                    <circle cx="64" cy="45" r="1.6" fill="#ffffff"/>
                </g>
            </g>

            <!-- ── SORRISO ── -->
            <path id="bot-mouth" d="M 45 59 Q 50 63 55 59" fill="none" stroke="#ff8c42" stroke-width="2.4" stroke-linecap="round"/>

            <!-- ── HUMOR: sobrancelhas, 💢 e fumaça (aparecem com muitos cliques) ── -->
            <g class="brows" stroke="#ff8c42" stroke-width="2.6" stroke-linecap="round">
                <line id="brow-left" x1="28" y1="37" x2="46" y2="37"/>
                <line id="brow-right" x1="72" y1="37" x2="54" y2="37"/>
            </g>
            <text class="anger-mark" x="80" y="40" font-size="13">💢</text>
            <g class="steam" fill="#c9c2b8">
                <circle class="puff p1" cx="14" cy="20" r="3.5"/>
                <circle class="puff p2" cx="86" cy="20" r="3.5"/>
                <circle class="puff p3" cx="50" cy="8" r="3"/>
            </g>

            <!-- ── BIGORNA ── -->
            <rect x="24" y="84.5" width="58" height="5.5" rx="2" fill="#343740"/>
            <polygon points="82,84.5 92,87.2 82,90" fill="#343740"/>
            <rect x="26" y="84.5" width="54" height="1.4" fill="rgba(255,255,255,.15)"/>
            <!-- metal quente sendo forjado -->
            <path class="hot-metal" d="M 31 84.5 L 45 84.5 L 43 81.8 L 33 81.8 Z" fill="#ffcc44"/>

            <!-- ── BRAÇO ESQUERDO (tora apoiada) ── -->
            <rect x="16" y="73" width="11" height="20" rx="5" fill="#4a3820" stroke="#8c6832" stroke-width="1.5" transform="rotate(12 21.5 83)"/>
            <circle cx="20" cy="89" r="5.5" fill="#5c4033" stroke="#8c6832" stroke-width="1.5"/>

            <!-- ── BRAÇO DO MARTELO (gira no ombro: 70,76) ── -->
            <g id="hammer-arm">
                <line x1="70" y1="78" x2="75" y2="63" stroke="#ff8c42" stroke-width="7.5" stroke-linecap="round"/>
                <line x1="70" y1="78" x2="75" y2="63" stroke="#3a2e22" stroke-width="4.5" stroke-linecap="round"/>
                <line x1="75" y1="62" x2="83" y2="46" stroke="#4a2e15" stroke-width="4" stroke-linecap="round"/>
                <g transform="rotate(-30 84 44)">
                    <rect x="77" y="34" width="14" height="20" rx="2.5" fill="#5a616b" stroke="#8ca6c2" stroke-width="1.8"/>
                    <rect x="75.5" y="32" width="17" height="4" rx="1.4" fill="#3b4047" stroke="#8ca6c2" stroke-width="1"/>
                    <rect x="75.5" y="52" width="17" height="4" rx="1.4" fill="#3b4047" stroke="#8ca6c2" stroke-width="1"/>
                    <polyline points="86.5,37.5 80.5,44.5 86,44.5 80.5,51" fill="none" stroke="#ffd700" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
                </g>
                <circle cx="75" cy="62" r="5.5" fill="#5c4033" stroke="#ff8c42" stroke-width="2"/>
                <circle cx="78.5" cy="58.5" r="3" fill="#5c4033" stroke="#ff8c42" stroke-width="1.5"/>
            </g>

            <!-- ── CÓDIGO FLUTUANDO EM VOLTA ── -->
            <text class="float-code f1" x="6" y="64" fill="#ff8c42" font-family="monospace" font-size="7" font-weight="bold">01</text>
            <text class="float-code f2" x="96" y="52" fill="#00ffcc" font-family="monospace" font-size="8" font-weight="bold">&lt;/&gt;</text>
            <text class="float-code f3" x="94" y="72" fill="#ffcc44" font-family="monospace" font-size="8" font-weight="bold">{ }</text>
            <text class="float-code f4" x="110" y="66" fill="#ff8c42" font-family="monospace" font-size="7" font-weight="bold">#</text>

            <!-- ── FAÍSCAS DE CÓDIGO NO IMPACTO ── -->
            <text class="spark s1" x="38" y="82" text-anchor="middle" fill="#00ffcc" font-family="monospace" font-size="6" font-weight="bold">&lt;/&gt;</text>
            <text class="spark s2" x="38" y="82" text-anchor="middle" fill="#ffcc44" font-family="monospace" font-size="7" font-weight="bold">{ }</text>
            <text class="spark s3" x="38" y="82" text-anchor="middle" fill="#ff6b1a" font-family="monospace" font-size="5" font-weight="bold">01</text>
            <text class="spark s4" x="38" y="82" text-anchor="middle" fill="#ffee55" font-family="monospace" font-size="6" font-weight="bold">#</text>
        </svg>
        </div>

        <div class="header-info">
            <h1>ByteForge</h1>
            <div class="status">
                <span class="status-dot"></span>
                <span>Tutor de programação</span>
            </div>
        </div>

        <span id="clock">00:00</span>
        <button id="clear-btn" title="Limpar conversa">&#x232B; Limpar</button>
    </div>

    <div id="resume-banner" hidden>
        <span>Você tem uma conversa salva neste navegador.</span>
        <button id="resume-btn" type="button">Continuar</button>
        <button id="new-chat-btn" type="button">Começar outra</button>
    </div>

    <!-- ══════════════════════════════════════
         JANELA DE CHAT
         ══════════════════════════════════════ -->
    <div id="chat-window" role="log" aria-label="Conversa" aria-live="polite" aria-relevant="additions"></div>

    <!-- ══════════════════════════════════════
         ATALHOS — tópicos rápidos
         ══════════════════════════════════════ -->
    <div id="atalhos">
        <button class="atalho" type="button" onclick="quickAsk('javascript')">JS</button>
        <button class="atalho" type="button" onclick="quickAsk('python')">Python</button>
        <button class="atalho" type="button" onclick="quickAsk('git')">Git</button>
        <button class="atalho" type="button" onclick="quickAsk('css')">CSS</button>
        <button class="atalho" type="button" onclick="quickAsk('api rest')">API/REST</button>
        <button class="atalho" type="button" onclick="quickAsk('debug')">Debug</button>
        <button class="atalho" type="button" onclick="quickAsk('sql')">SQL</button>
        <button class="atalho" type="button" onclick="quickAsk('typescript')">TypeScript</button>
        <button class="atalho" type="button" onclick="quickAsk('docker')">Docker</button>
        <button class="atalho" type="button" onclick="quickAsk('carreira dev')">Carreira</button>
    </div>

    <!-- balão de pensamento do mascote (position: fixed via JS) -->
    <div id="thought-bubble"></div>

    <!-- ══════════════════════════════════════
         INPUT
         ══════════════════════════════════════ -->
    <div id="input-area">
        <label class="sr-only" for="user-input">Sua pergunta ou tentativa de código</label>
        <input id="user-input" type="text"
               placeholder="Descreva seu problema ou escolha um atalho..."
               autocomplete="off">
        <button id="send-btn" type="button" title="Enviar (Enter)" aria-label="Enviar mensagem">
            <!-- ícone de avião de papel (send) -->
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                 stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
        </button>
    </div>
</div>
<script src="js/brain.js" charset="UTF-8"></script>
<script src="js/exercicios.js" charset="UTF-8"></script>
<script src="js/ai.js" charset="UTF-8"></script>
<script src="js/script.js" charset="UTF-8"></script>
</body>
</html>
